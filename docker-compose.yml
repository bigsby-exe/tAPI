version: '3.8'
services:
  db:
    image: postgres:15
    container_name: tapi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapi_password}
      POSTGRES_DB: ${POSTGRES_DB:-tapi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tapi_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: tapi_api
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-tapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tapi_password}
      POSTGRES_DB: ${POSTGRES_DB:-tapi_db}
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: